<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Fondo con gradiente circular estilo App Icon -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e7e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Vidrio de la pecera -->
    <radialGradient id="glassSphere" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#e0f2fe" stop-opacity="0.75"/>
      <stop offset="75%" stop-color="#7dd3fc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.65"/>
    </radialGradient>

    <!-- Rojo cereza de la máquina -->
    <linearGradient id="cherryRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d79"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <!-- Metal cromado brillante -->
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Insignia circular de fondo para máximo contraste en cualquier tema -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)" filter="url(#iconShadow)"/>
  <rect x="5.5" y="5.5" width="117" height="117" rx="30.5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- ==================== LA CHICLERA ==================== -->
  <g transform="translate(64, 64) scale(0.92) translate(-64, -64)">
    <!-- Base inferior de soporte -->
    <path d="M34 112 L94 112 L88 104 L40 104 Z" fill="#4c0519"/>
    <rect x="36" y="108" width="56" height="5" rx="2.5" fill="#2d0510"/>

    <!-- Cuerpo rojo inferior (caja recolectora) -->
    <path d="M38 72 L90 72 L86 105 C86 107, 84 108, 81 108 L47 108 C44 108, 42 107, 42 105 Z" fill="#ffffff" filter="url(#iconShadow)"/>
    <path d="M39 73 L89 73 L85 104 C85 106, 83 107, 80 107 L48 107 C45 107, 43 106, 43 104 Z" fill="url(#cherryRed)"/>

    <!-- Salida de chicles / compuerta -->
    <rect x="54" y="91" width="20" height="14" rx="4" fill="#1e293b"/>
    <path d="M55 92 L73 92 C73 95, 71 101, 64 101 C57 101, 55 95, 55 92 Z" fill="url(#chrome)"/>

    <!-- Manivela cromada central (mecanismo giratorio) -->
    <circle cx="64" cy="81" r="8" fill="url(#chrome)" stroke="#334155" stroke-width="1"/>
    <circle cx="64" cy="81" r="5" fill="#1e293b"/>
    <!-- Mariposa de giro en cruz -->
    <rect x="58" y="80" width="12" height="2.2" rx="1.1" fill="#ffffff"/>
    <rect x="62.9" y="75" width="2.2" height="12" rx="1.1" fill="#ffffff"/>
    <circle cx="64" cy="81" r="1.8" fill="#0f172a"/>

    <!-- Anillo conector cromado -->
    <rect x="37" y="68" width="54" height="5" rx="2.5" fill="url(#chrome)"/>

    <!-- Globo de cristal transparente -->
    <circle cx="64" cy="44" r="28" fill="url(#glassSphere)" stroke="#ffffff" stroke-width="2" filter="url(#iconShadow)"/>

    <!-- Bolas de chicles adentro -->
    <!-- Fila base -->
    <circle cx="53" cy="60" r="5.6" fill="#fbbf24"/>
    <circle cx="64" cy="62" r="5.7" fill="#ef4444"/>
    <circle cx="75" cy="60" r="5.6" fill="#10b981"/>
    <circle cx="43" cy="55" r="5.4" fill="#3b82f6"/>
    <circle cx="85" cy="55" r="5.4" fill="#a855f7"/>

    <!-- Fila centro -->
    <circle cx="50" cy="50" r="5.6" fill="#f97316"/>
    <circle cx="62" cy="52" r="5.8" fill="#ec4899"/>
    <circle cx="74" cy="50" r="5.7" fill="#06b6d4"/>
    <circle cx="42" cy="45" r="5.3" fill="#fbbf24"/>
    <circle cx="85" cy="45" r="5.3" fill="#ef4444"/>

    <!-- Fila arriba -->
    <circle cx="55" cy="40" r="5.5" fill="#10b981"/>
    <circle cx="68" cy="41" r="5.6" fill="#f59e0b"/>
    <circle cx="64" cy="31" r="5.2" fill="#8b5cf6"/>
    <circle cx="52" cy="31" r="5.1" fill="#3b82f6"/>
    <circle cx="76" cy="33" r="5.1" fill="#ec4899"/>

    <!-- Reflejos curvados de brillo sobre el cristal -->
    <path d="M45 27 C51 21, 62 18, 72 21 C68 23, 56 24, 49 34 C46 32, 45 29, 45 27 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="80" cy="27" r="2.8" fill="#ffffff" opacity="0.85"/>

    <!-- Tapa superior cromada y roja -->
    <ellipse cx="64" cy="19" rx="17" ry="5" fill="url(#chrome)"/>
    <path d="M49 18 C49 13, 55 9, 64 9 C73 9, 79 13, 79 18 Z" fill="url(#cherryRed)"/>
    <circle cx="64" cy="8" r="3.5" fill="url(#chrome)"/>
  </g>
</svg>
